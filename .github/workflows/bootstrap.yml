name: Bootstrap Courier Radar source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/source.tgz.b64 || exit 0
          base64 -d .bootstrap/source.tgz.b64 > /tmp/courier-radar-src.tgz
          tar -xzf /tmp/courier-radar-src.tgz -C .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full Courier Radar app with adaptive map network layer"
          git push
