name: CourierRadar
options:
  bundleIdPrefix: com.courierradar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  preGenCommand: swift Tools/MakeAppIcon.swift && sips -z 1024 1024 RadarApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png >/dev/null
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
packages:
  RadarCore:
    path: .
targets:
  CourierRadar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RadarApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.courierradar.native
        PRODUCT_NAME: CourierRadar
        INFOPLIST_FILE: RadarApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: RadarCore
    scheme:
      testTargets: []
schemes:
  CourierRadar:
    build:
      targets:
        CourierRadar: all
    run:
      config: Debug
    archive:
      config: Release
